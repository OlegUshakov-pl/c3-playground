<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C3 Playground</title>
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<style>
		:root {
			--bg-dark: #0f172a;
			--panel-bg: #1e293b;
			--border: #334155;
			--accent: #38bdf8;
			--accent-hover: #0284c7;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--console-bg: #090d16;
		}
		[data-theme="light"] {
			--bg-dark: #f1f5f9;
			--panel-bg: #ffffff;
			--border: #cbd5e1;
			--accent: #0ea5e9;
			--accent-hover: #0284c7;
			--text-main: #0f172a;
			--text-muted: #64748b;
			--console-bg: #f8fafc;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: var(--bg-dark);
			color: var(--text-main);
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			background-color: var(--panel-bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		header h1 img {
			height: 50px;
			width: auto;
		}

		header h1 {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--accent);
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		/* Navbar dropdown menu */
		.nav-menu {
			position: relative;
			display: inline-flex;
		}
		.menu-btn {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-weight: 600;
			padding: 8px 14px;
			background: var(--bg-dark);
			border: 1px solid var(--border);
		}
		.menu-btn:hover { border-color: var(--accent); color: var(--accent); }
		.menu-dropdown {
			display: none;
			position: absolute;
			top: calc(100% + 8px);
			left: 0;
			min-width: 200px;
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
			z-index: 1200;
			padding: 6px;
			flex-direction: column;
		}
		.menu-dropdown.open { display: flex; }
		.menu-item {
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			color: var(--text-main);
			padding: 8px 10px;
			border-radius: 6px;
			font-size: 0.85rem;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}
		.menu-item:hover { background: rgba(56,189,248,0.12); color: var(--accent); }
		.menu-item.active { color: var(--accent); font-weight: 600; }
		.menu-shortcut { font-size: 0.75rem; color: var(--text-muted); }
		.menu-divider { height: 1px; background: var(--border); margin: 6px 0; }
		.menu-submenu { position: relative; }
		.submenu-trigger { cursor: pointer; user-select: none; }
		.submenu {
			display: none;
			position: absolute;
			top: -6px;
			left: calc(100% + 6px);
			min-width: 160px;
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
			padding: 6px;
			flex-direction: column;
			z-index: 1201;
		}
		.menu-submenu:hover .submenu,
		.menu-submenu.open .submenu { display: flex; }
		[data-theme="light"] .menu-dropdown,
		[data-theme="light"] .submenu { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }

		.docs-link {
			font-size: 0.85rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: normal;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			transition: color 0.2s ease;
			background: none;
			border: none;
			padding: 0;
			cursor: pointer;
			font-family: inherit;
		}

		.docs-link:hover {
			color: var(--accent);
		}

		.controls {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		select,
		button {
			font-size: 0.9rem;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg-dark);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:focus,
		button:focus {
			outline: none;
			border-color: var(--accent);
		}

		button.primary {
			background-color: var(--accent);
			color: #0f172a;
			font-weight: 600;
			border: none;
		}

		button.primary:hover:not(:disabled) {
			background-color: var(--accent-hover);
			color: #fff;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.status-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.status-badge {
			font-size: 0.8rem;
			padding: 4px 8px;
			border-radius: 12px;
			background: #334155;
			color: var(--text-muted);
			transition: all 0.2s ease;
			user-select: none;
		}

		.status-badge.ready {
			background: #064e3b;
			color: #34d399;
			cursor: pointer;
		}

		.status-badge.ready:hover {
			background: #047857;
			color: #10b981;
		}

		.status-badge.compiling {
			background: #78350f;
			color: #fbbf24;
		}

		.status-tooltip {
			opacity: 0;
			visibility: hidden;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background-color: #0b1329;
			border: 1px solid var(--border);
			color: #e2e8f0;
			padding: 12px;
			border-radius: 6px;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.75rem;
			line-height: 1.5;
			white-space: pre;
			z-index: 1000;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.6);
			pointer-events: none;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.status-container:hover .status-badge.ready~.status-tooltip {
			opacity: 1;
			visibility: visible;
		}

		.settings-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.settings-btn {
			padding: 8px;
			background: var(--bg-dark);
			border: 1px solid var(--border);
			border-radius: 6px;
			color: var(--text-main);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.settings-btn:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.settings-popover {
			display: none;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			width: 320px;
			background: #0b1329;
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 16px;
			z-index: 1000;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
			flex-direction: column;
			gap: 8px;
		}

		.settings-popover.active {
			display: flex;
		}

		.popover-header {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--accent);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 2px;
		}

		.settings-popover label {
			font-size: 0.8rem;
			color: var(--text-muted);
		}

		.settings-popover input {
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.85rem;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--panel-bg);
			color: var(--text-main);
			width: 100%;
		}

		.settings-popover input:focus {
			outline: none;
			border-color: var(--accent);
		}

		.popover-help {
			font-size: 0.75rem;
			color: var(--text-muted);
			line-height: 1.4;
		}

		main {
			flex: 1;
			display: grid;
			grid-template-columns: var(--sidebar-w, 260px) 14px 1fr 14px 1fr;
			padding: 12px;
			overflow: hidden;
			box-sizing: border-box;
		}
		main.sidebar-collapsed { --sidebar-w: 0px; }

		.sidebar {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			min-width: 0;
		}
		.sidebar.collapsed { display: none; }
		.sidebar-header {
			background: rgba(15,23,42,0.4);
			padding: 8px 10px;
			font-size: 0.8rem;
			font-weight: 700;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 6px;
			letter-spacing: 0.5px;
		}
		[data-theme="light"] .sidebar-header { background: rgba(241,245,249,0.8); }
		.sidebar-actions { display: flex; gap: 4px; }
		.sidebar-actions .icon-btn { padding: 3px; }
		.sidebar-toggle-btn {
			background: transparent;
			border: 1px solid transparent;
			color: var(--text-muted);
			padding: 3px 6px;
			border-radius: 4px;
			cursor: pointer;
		}
		.sidebar-toggle-btn:hover { color: var(--accent); border-color: var(--border); background: rgba(56,189,248,0.08); }
		.file-tree {
			flex: 1;
			overflow-y: auto;
			padding: 6px 4px;
			font-size: 0.82rem;
			line-height: 1.4;
			user-select: none;
		}
		.file-item {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 4px 6px;
			border-radius: 4px;
			cursor: pointer;
			color: var(--text-main);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.file-item:hover { background: rgba(56,189,248,0.1); }
		.file-item.active { background: rgba(56,189,248,0.18); color: var(--accent); font-weight: 600; }
		.file-item.folder { font-weight: 600; color: var(--text-muted); }
		.file-item .file-icon { flex-shrink: 0; opacity: 0.8; }
		.file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
		.file-item .file-actions { display: none; gap: 2px; }
		.file-item:hover .file-actions { display: flex; }
		.file-item .mini-btn {
			background: transparent; border: none; color: var(--text-muted);
			padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 0.75rem;
		}
		.file-item .mini-btn:hover { color: var(--accent); background: rgba(56,189,248,0.12); }
		.file-nested { margin-left: 14px; border-left: 1px dotted var(--border); padding-left: 4px; }
		.file-drop-target { background: rgba(56,189,248,0.22) !important; outline: 1px dashed var(--accent); }
		.sidebar-empty { padding: 16px 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center; line-height: 1.5; }

		.pane {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.resizer {
			width: 14px;
			cursor: col-resize;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			user-select: none;
			position: relative;
		}
		.resizer::before {
			content: "";
			position: absolute;
			inset: 0;
			left: -4px;
			right: -4px;
		}

		.resizer::after {
			content: "";
			width: 2px;
			height: 40px;
			background-color: var(--border);
			border-radius: 1px;
			transition: background-color 0.2s ease, height 0.2s ease, width 0.2s ease;
		}

		.resizer:hover::after,
		.resizer.dragging::after {
			background-color: var(--accent);
			height: 100%;
		}
		.pane, .sidebar { min-width: 60px; }

		.pane-header {
			background: rgba(15, 23, 42, 0.4);
			padding: 8px 16px;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		[data-theme="light"] .pane-header { background: rgba(241,245,249,0.8); }

		.editor-actions {
			display: flex;
			gap: 8px;
		}

		.icon-btn {
			background: transparent;
			border: none;
			color: var(--text-muted);
			padding: 4px;
			cursor: pointer;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
		}

		.icon-btn:hover {
			color: var(--accent);
			background: rgba(56, 189, 248, 0.1);
		}

		.icon-btn svg {
			width: 16px;
			height: 16px;
		}

		#code {
			flex: 1;
			width: 100%;
			min-height: 0;
		}

		pre {
			flex: 1;
			background: var(--console-bg);
			color: #38bdf8;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 13px;
			line-height: 1.5;
			padding: 16px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-all;
			-webkit-overflow-scrolling: touch;
		}
		[data-theme="light"] pre { color: #0369a1; }
		[data-theme="light"] #canvasContainer { background: #e2e8f0; }

		#canvasContainer {
			position: relative;
			display: none;
			background: #090d16;
			border-bottom: 1px solid var(--border);
			resize: vertical;
			overflow: hidden;
			height: 481px;
			min-height: 80px;
			max-height: 95%;
		}

		#canvasContainer:fullscreen {
			border: none;
			max-height: none;
			background: #000;
			padding: 0;
		}

		#canvasContainer:fullscreen .canvas-wrapper {
			padding: 0;
		}

		.canvas-wrapper {
			display: flex;
			width: 100%;
			height: 100%;
			padding: 6px;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
			overflow: hidden;
		}

		#canvas {
			background: #000;
			border: 1px solid var(--border);
			image-rendering: auto;
			display: block;
			box-sizing: border-box;
			outline: none;
			user-select: none;
			-webkit-user-select: none;
		}

		.canvas-fullscreen-btn {
			position: absolute;
			top: 12px;
			right: 12px;
			background: rgba(15, 23, 42, 0.85);
			border: 1px solid var(--border);
			color: var(--text-main);
			border-radius: 6px;
			padding: 6px;
			cursor: pointer;
			opacity: 0;
			transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		#canvasContainer:hover .canvas-fullscreen-btn {
			opacity: 1;
		}

		@media (hover: none),
		(pointer: coarse) {
			.canvas-fullscreen-btn {
				opacity: 1;
				background: rgba(15, 23, 42, 0.75);
			}
		}

		.canvas-fullscreen-btn:hover {
			background: var(--accent);
			color: #0f172a;
		}

		@media (max-width: 768px) {
			#canvasContainer {
				height: 140px;
			}
		}

		.console-link:hover {
			text-decoration: underline !important;
			color: #0284c7 !important;
		}

		@media (max-width: 768px) {
			main {
				grid-template-columns: 1fr !important;
				grid-template-rows: auto 10px 1fr 10px 1fr;
			}
			.sidebar { max-height: 220px; }
			.sidebar.collapsed { display: flex; } /* on mobile show as top panel */
			main.sidebar-collapsed { --sidebar-w: 0px; } /* ignore on mobile */

			.resizer {
				width: 100%;
				height: 10px;
				cursor: row-resize;
			}

			.resizer::after {
				width: 40px;
				height: 2px;
			}

			.resizer:hover::after,
			.resizer.dragging::after {
				width: 100%;
				height: 2.2px;
			}
		}

		@media (max-width: 480px) {
			header {
				padding: 12px;
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}

			.controls {
				width: 100%;
				justify-content: space-between;
			}

			select {
				flex: 1;
				max-width: 150px;
			}
		}

		/* Stdlib Docs Modal */
		#stdlibDocsModal {
			position: fixed;
			inset: 0;
			z-index: 9000;
			background: rgba(0, 0, 0, 0.72);
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.18s ease;
		}
		#stdlibDocsModal.open {
			opacity: 1;
			pointer-events: all;
		}
		#stdlibDocsPanel {
			position: relative;
			width: 92vw;
			height: 90vh;
			background: #1e2029;
			border: 1px solid #323542;
			border-radius: 10px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			box-shadow: 0 24px 64px rgba(0,0,0,0.6);
			transform: scale(0.97);
			transition: transform 0.18s ease;
		}
		#stdlibDocsModal.open #stdlibDocsPanel {
			transform: scale(1);
		}
		#stdlibDocsClose {
			position: absolute;
			top: 10px;
			right: 12px;
			z-index: 10;
			background: rgba(255,255,255,0.08);
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 6px;
			color: #e2e8f0;
			padding: 5px 8px;
			cursor: pointer;
			display: flex;
			align-items: center;
			transition: background 0.15s;
		}
		#stdlibDocsClose:hover { background: rgba(255,255,255,0.16); }
		#stdlibDocsIframe {
			flex: 1;
			width: 100%;
			border: none;
			background: #1e2029;
		}
	</style>

</head>

<body>

	<header>
		<h1>
			<img src="favicon.svg" alt="C3 Logo">
			<span>Playground</span>
			<button id="docsBtn" class="docs-link" title="Open C3 Standard Library Documentation">
				<span>Open Docs</span>
				<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
					<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
				</svg>
			</button>
			<div class="nav-menu">
				<button id="menuBtn" class="menu-btn" aria-haspopup="true" aria-expanded="false" title="Menu">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
					Menu
					<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
				</button>
				<div id="menuDropdown" class="menu-dropdown" role="menu">
					<button id="menuNew" class="menu-item" role="menuitem">New <span class="menu-shortcut">Ctrl+N</span></button>
					<button id="menuOpen" class="menu-item" role="menuitem">Open File... <span class="menu-shortcut">Ctrl+O</span></button>
					<button id="menuSaveAs" class="menu-item" role="menuitem">Save As... <span class="menu-shortcut">Ctrl+S</span></button>
					<button id="menuResetLayout" class="menu-item" role="menuitem">Reset Layout</button>
					<div class="menu-divider"></div>
					<div class="menu-submenu" id="themeSubmenu">
						<button class="menu-item submenu-trigger" aria-haspopup="true">Theme <span>▸</span></button>
						<div class="submenu" role="menu">
							<button class="menu-item theme-option active" data-theme-value="dark" role="menuitem">Dark <span class="theme-check">✓</span></button>
							<button class="menu-item theme-option" data-theme-value="light" role="menuitem">Light <span class="theme-check" style="opacity:0">✓</span></button>
						</div>
					</div>
				</div>
			</div>
		</h1>
		<div class="controls">
			<select id="exampleSelect">
				<option value="" disabled selected hidden>Examples...</option>
			</select>

			<div class="status-container">
				<span id="status" class="status-badge">Loading...</span>
				<pre id="statusTooltip" class="status-tooltip">Fetching version...</pre>
			</div>

			<div class="settings-container">
				<button id="settingsBtn" class="settings-btn" title="Compiler Settings" aria-label="Compiler Settings">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="3"></circle>
						<path
							d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
						</path>
					</svg>
				</button>
				<div id="settingsPopover" class="settings-popover">
					<div class="popover-header">Compiler Flags</div>
					<label for="extraFlagsInput">Extra Arguments:</label>
					<input type="text" id="extraFlagsInput" placeholder="-O3 --safe=yes -D FOO" spellcheck="false"
						autocomplete="off">
					<span class="popover-help">Additional flags passed directly to <code>c3c compile</code>.</span>
				</div>
			</div>

			<button id="compileBtn" class="primary" title="Compile & Run (Ctrl+Enter)" disabled>Compile & Run</button>
		</div>
	</header>

	<main id="mainLayout">
		<div id="sidebar" class="sidebar">
			<div class="sidebar-header">
				<span style="display:flex;align-items:center;gap:6px;">
					<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
					FILES
				</span>
				<div class="sidebar-actions">
					<button id="newFileBtn" class="icon-btn" title="New File"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
					<button id="newFolderBtn" class="icon-btn" title="New Folder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>
					<button id="sidebarCollapseBtn" class="sidebar-toggle-btn" title="Collapse Sidebar">◀</button>
				</div>
			</div>
			<div id="fileTree" class="file-tree"></div>
			<div id="fileContextMenu" class="menu-dropdown" style="position:fixed;min-width:160px;display:none;z-index:2000;"></div>
		</div>

		<div class="resizer" id="sidebarResizer" title="Drag to resize sidebar"></div>

		<div class="pane" id="editorPane">
			<div class="pane-header">
				<span style="display:flex;align-items:center;gap:8px;">
					<button id="sidebarShowBtn" class="sidebar-toggle-btn" title="Show Explorer" style="display:none;">▶</button>
					<span>SOURCE CODE (C3)</span>
					<span id="activeFileLabel" style="font-weight:400;font-size:0.78rem;color:var(--text-muted);"></span>
				</span>
				<div class="editor-actions">
					<button id="shareBtn" title="Share Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<circle cx="18" cy="5" r="3"></circle>
							<circle cx="6" cy="12" r="3"></circle>
							<circle cx="18" cy="19" r="3"></circle>
							<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
							<line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
						</svg>
					</button>
					<button id="copyBtn" title="Copy Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
							<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
					</button>
					<button id="saveBtn" title="Save File (Ctrl+S)" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
							<polyline points="17 21 17 13 7 13 7 21"></polyline>
							<polyline points="7 3 7 8 15 8"></polyline>
						</svg>
					</button>
				</div>
			</div>
			<div id="code"></div>
		</div>

		<div class="resizer" id="resizer"></div>

		<div class="pane">
			<div class="pane-header">
				<span>CONSOLE OUTPUT</span>
				<button id="clearBtn" title="Clear console and stop execution" class="icon-btn"
					aria-label="Clear console and stop execution">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
						stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
						<line x1="10" y1="11" x2="10" y2="17"></line>
						<line x1="14" y1="11" x2="14" y2="17"></line>
					</svg>
				</button>
			</div>
			<div id="canvasContainer">
				<button id="canvasFullscreenBtn" class="canvas-fullscreen-btn" title="Toggle Fullscreen"
					aria-label="Toggle Fullscreen">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
						</path>
					</svg>
				</button>
				<div class="canvas-wrapper">
					<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault(); return false;"></canvas>
				</div>
			</div>
			<pre id="output"></pre>
		</div>
	</main>

	<script src="build/emscripten_runtime.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
	<script type="module" src="js/main.js"></script>
	<!-- Stdlib Docs Modal -->
	<div id="stdlibDocsModal" role="dialog" aria-modal="true" aria-label="Standard Library Documentation">
		<div id="stdlibDocsPanel">
			<button id="stdlibDocsClose" title="Close (Esc)" aria-label="Close">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
					stroke-linecap="round" stroke-linejoin="round">
					<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
				</svg>
			</button>
			<iframe id="stdlibDocsIframe" sandbox="allow-scripts allow-same-origin" src="about:blank"></iframe>
		</div>
	</div>
</body>

</html>
